name: CI

# Runs on every push and on every pull request, as required by the assignment.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------
  # SAST -- static analysis of our own source code
  # ---------------------------------------------------------------------
  sast-bandit:
    name: SAST / bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bandit
        run: pip install bandit==1.7.10 bandit-sarif-formatter==1.1.1
      - name: Run bandit (fail on medium+ severity)
        run: |
          bandit -r app run.py -ll -f screen
          bandit -r app run.py -ll -f sarif -o bandit.sarif || true
      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
        continue-on-error: true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.sarif

  # ---------------------------------------------------------------------
  # SCA -- known vulnerabilities in third-party dependencies
  # ---------------------------------------------------------------------
  sca-pip-audit:
    name: SCA / pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: pip-audit
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --strict --desc on | tee pip-audit.txt
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.txt

  # ---------------------------------------------------------------------
  # Tests -- functional + security regression suite
  # ---------------------------------------------------------------------
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the test suite
        env:
          JWT_SECRET: ci-only-secret-do-not-deploy-0123456789abcdef
        run: pytest -q --maxfail=1
